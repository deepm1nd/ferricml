[workspace]
resolver = "2"
members = [
    "crates/ferric-core",
    "crates/ferric-ir",
    "crates/ferric-autograd",
    "crates/ferric-backend-cpu",
    "crates/ferric-backend-cuda",
    "crates/ferric-nn",
    "crates/ferric-tree",
    "crates/ferric-pgm",
    "crates/ferric-serialization",
    "crates/ferricml",
    "validation",
    "examples/linear_regression",
    "examples/mnist_tutorial",
    "examples/train_and_export",
]

[workspace.dependencies]
smallvec = { version = "1.11", features = ["serde"] }
arc-swap = "1.6"
half = { version = "2.3", features = ["serde"] }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
flate2 = "1.0"
chrono = "0.4"
thiserror = "1.0"
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive", "extern_crate_alloc"] }
log = "0.4"
env_logger = "0.10"
ndarray = "0.15"
petgraph = "0.6"
rand = "0.8"
bitflags = "2.4"
num-traits = "0.2"
safetensors = "0.3"
gguf-rs = "0.1"
